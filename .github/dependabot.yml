# Dependabot opens a pull request when a dependency has a newer release. A release must be at
# least 14 days old before it is suggested (the cooldown), which lowers the risk of adopting a
# compromised or broken new release.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
