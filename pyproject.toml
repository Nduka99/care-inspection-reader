# Dependencies are managed with uv: `uv sync` builds .venv from uv.lock (committed).
# Add one with `uv add <pkg>` (runtime) or `uv add --dev <pkg>`; never pip-install ad hoc.

[project]
name = "care-inspection-reader"
version = "0.1.0"
description = "Finds safety concerns in public CQC home care inspection reports and checks them against the inspectors' scores"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
# Runtime uses the standard library only (urllib, html.parser, csv).
dependencies = []

[project.scripts]
inspection-reader = "inspection_reader.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "inspection_reader"

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
mypy_path = "src"
files = ["src", "tests", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
